name: Apply Latest Trade Impact Fix

on:
  push:
    branches:
      - main
    paths:
      - "scripts/patch-latest-trade-impact.py"
      - ".github/workflows/apply-latest-trade-impact-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch generator
        run: python scripts/patch-latest-trade-impact.py
      - name: Regenerate summaries
        run: |
          python generate_weekly_executive_summary_filtered.py
          python finalize_franchise_summaries.py
      - name: Validate Big Balder summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("knowledge/franchise_summaries/big-balder-brand.json").read_text())
          d = p["dynasty_power"]
          assert d["rank"] == 6, d
          assert round(float(d["score"]), 1) == 1411.0, d
          trade = p.get("latest_trade")
          assert trade and trade.get("summary"), trade
          section = next(s for s in p["sections"] if s["id"] == "latest-trade-impact")
          assert "No franchise trade" not in section["body"], section
          print(d)
          print(section["body"])
          PY
      - name: Commit corrected source and summaries
        run: |
          git config user.name "AVI-Automation"
          git config user.email "actions@users.noreply.github.com"
          git add generate_weekly_executive_summary_filtered.py knowledge/franchise_summaries
          git commit -m "Fix dynasty and latest trade executive summary data"
          git push origin HEAD:main
