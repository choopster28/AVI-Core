name: Automatic Sleeper Update

on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
    - cron: "30 1,4,7,10,13,16,19,22 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avi-data-updates
  cancel-in-progress: false

jobs:
  auto-sleeper-update:
    runs-on: ubuntu-latest

    env:
      SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}

      SLEEPER_BASE_URL: "https://api.sleeper.app/v1"

      AVI_EARLIEST_SEASON: "2025"
      TRANSACTION_START_WEEK: "0"
      TRANSACTION_END_WEEK: "18"
      AVI_EXPECTED_TEAM_COUNT: "16"
      AVI_MINIMUM_COMPLETED_TRADES: "10"

      AVI_SEASON: "2026"
      AVI_SCORING: "PPR"
      AVI_METHODOLOGY_VERSION: "2026.2"

    steps:
      - name: Check out AVI Core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AVI Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Update rosters and traded picks from Sleeper
        run: python -m avi.cli update-sleeper

      - name: Validate Sleeper data
        run: python -m avi.cli validate-sleeper

      - name: Validate canonical AVI inputs before rebuilding derivatives
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("data/processed/identity/avi_player_registry.json").read_text())
          avi_players = json.loads(Path("data/processed/avi/avi_players.json").read_text())
          if not isinstance(registry, list) or len(registry) < 300:
              raise SystemExit(f"Canonical AVI registry is invalid ({len(registry) if isinstance(registry, list) else 'not a list'} players); refusing to publish derived Sleeper outputs.")
          if not isinstance(avi_players, list) or len(avi_players) < 300:
              raise SystemExit(f"Canonical AVI player output is invalid ({len(avi_players) if isinstance(avi_players, list) else 'not a list'} players); refusing to publish derived Sleeper outputs.")
          print(f"Canonical AVI preflight passed: {len(registry)} registry players, {len(avi_players)} AVI players.")
          PY

      - name: Rebuild player lookup
        run: python -m avi.cli build-player-lookup

      - name: Rebuild draft pick values
        run: python -m avi.cli build-draft-pick-values

      - name: Rebuild historical trades
        run: python -m avi.cli build-historical-trades

      - name: Upload Sleeper snapshot
        uses: actions/upload-artifact@v4
        with:
          name: avi-auto-sleeper-snapshot
          path: |
            data/raw/
            data/processed/
            knowledge/
          if-no-files-found: error
          retention-days: 30

      - name: Commit updated Sleeper data
        run: |
          git config user.name "avi-automation"
          git config user.email "avi-automation@users.noreply.github.com"

          git add data knowledge

          if git diff --cached --quiet; then
            echo "No Sleeper data changes to commit."
            exit 0
          fi

          git commit -m "Automatic Sleeper update"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Sleeper data pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed."
            sleep 5
          done

          echo "Failed to push Sleeper data after 3 attempts."
          exit 1
