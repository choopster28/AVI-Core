name: Weekly Franchise Executive Summaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_weekly_executive_summary.py"
      - "generate_weekly_executive_summary_filtered.py"
      - "finalize_franchise_summaries.py"
      - ".github/workflows/weekly-franchise-executive-summary.yml"
      - "knowledge/teams/**"
      - "knowledge/02_AVI_Historical_Trades.md"
      - "data/raw/sleeper/**/transactions.json"
      - "data/processed/reports/draft_pick_values.json"
      - "data/processed/reports/historical_trade_analysis.json"
  schedule:
    # GitHub cron is UTC. Both hours are registered, then the job enforces
    # Wednesday 11:00 AM America/Denver so DST cannot shift the local refresh.
    - cron: "0 17 * * 3"
    - cron: "0 18 * * 3"

permissions:
  contents: write

concurrency:
  group: weekly-franchise-executive-summaries
  cancel-in-progress: false

jobs:
  generate-franchise-summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Wednesday 11 AM Mountain Time
        id: local_time
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("America/Denver"))
          allowed = now.weekday() == 2 and now.hour == 11
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"allowed={'true' if allowed else 'false'}\n")
          print(f"Mountain time: {now.isoformat()} | allowed={allowed}")
          PY

      - name: Generate all 16 franchise summaries
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: python generate_weekly_executive_summary_filtered.py

      - name: Finalize canonical dynasty and rival data
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: python finalize_franchise_summaries.py

      - name: Verify complete, current output set
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("knowledge/franchise_summaries")
          files = sorted(
              path for path in root.glob("*.json")
              if path.name != "manifest.json"
          )
          if len(files) != 16:
              raise SystemExit(
                  f"Expected 16 franchise summaries, found {len(files)}"
              )

          manifest_path = root / "manifest.json"
          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )
          if (
              manifest.get("franchise_count") != 16
              or len(manifest.get("files", [])) != 16
          ):
              raise SystemExit(
                  "Manifest does not declare all 16 franchise summaries"
              )

          generated = datetime.fromisoformat(manifest["generated_at"])
          if generated.tzinfo is None:
              generated = generated.replace(tzinfo=timezone.utc)
          age_seconds = (
              datetime.now(timezone.utc)
              - generated.astimezone(timezone.utc)
          ).total_seconds()
          if age_seconds > 900:
              raise SystemExit(
                  f"Generated manifest is stale by {age_seconds:.0f} seconds"
              )

          for path in files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              projected = payload.get("projected_power") or {}
              team_below = projected.get("team_below")
              rival = payload.get("rival_below")

              if team_below is None:
                  if rival is not None:
                      raise SystemExit(
                          f"Unexpected rival for last-place franchise: {path}"
                      )
              else:
                  if not rival:
                      raise SystemExit(f"Missing Rival Watch: {path}")
                  if rival.get("franchise_name") != team_below.get("name"):
                      raise SystemExit(
                          f"Rival Watch does not match team_below: {path}"
                      )
                  if rival.get("projected_rank") != team_below.get("rank"):
                      raise SystemExit(
                          f"Rival Watch rank does not match team_below: {path}"
                      )
                  if "latest_activity" not in rival:
                      raise SystemExit(
                          f"Rival Watch latest_activity missing: {path}"
                      )

              dynasty = payload.get("dynasty_power") or {}
              expected = round(
                  float(dynasty.get("player_d_avi") or 0)
                  + float(dynasty.get("future_pick_d_avi") or 0),
                  2,
              )
              actual = round(float(dynasty.get("score") or 0), 2)
              if expected != actual:
                  raise SystemExit(
                      f"Dynasty score does not reconcile in {path}: "
                      f"expected {expected}, found {actual}"
                  )

              text = path.read_text(encoding="utf-8")
              if "original roster" in text.casefold():
                  raise SystemExit(
                      f"Untranslated roster ID found in {path}"
                  )

          json.loads(manifest_path.read_text(encoding="utf-8"))
          print(
              "Verified 16 fresh summaries, canonical dynasty values, "
              "and rival activity attribution."
          )
          PY

      - name: Commit refreshed summaries
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        shell: bash
        run: |
          if git diff --quiet -- knowledge/franchise_summaries; then
            echo "No franchise summary changes to commit."
            exit 0
          fi

          git config user.name "AVI-Automation"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/franchise_summaries
          git commit -m "Refresh weekly franchise executive summaries"

          # A data workflow may have committed while this job was running.
          # Rebase the generated summary commit before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
