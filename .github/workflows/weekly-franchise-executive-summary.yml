name: Weekly Franchise Executive Summaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_weekly_executive_summary.py"
      - "generate_weekly_executive_summary_filtered.py"
      - "finalize_franchise_summaries.py"
      - "scripts/patch-latest-trade-impact.py"
      - ".github/workflows/weekly-franchise-executive-summary.yml"
      - "knowledge/teams/**"
      - "knowledge/02_AVI_Historical_Trades.md"
      - "data/raw/sleeper/**/transactions.json"
      - "data/raw/sleeper/**/traded_picks.json"
      - "data/processed/reports/draft_pick_values.json"
      - "data/processed/reports/historical_trades.json"
  schedule:
    - cron: "0 17 * * 3"
    - cron: "0 18 * * 3"

permissions:
  contents: write

concurrency:
  group: weekly-franchise-executive-summaries
  cancel-in-progress: false

jobs:
  generate-franchise-summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce Wednesday 11 AM Mountain Time
        id: local_time
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("America/Denver"))
          allowed = now.weekday() == 2 and now.hour == 11
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"allowed={'true' if allowed else 'false'}\n")
          print(f"Mountain time: {now.isoformat()} | allowed={allowed}")
          PY

      - name: Apply verified latest-trade logic
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: python scripts/patch-latest-trade-impact.py

      - name: Generate all 16 franchise summaries
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: python generate_weekly_executive_summary_filtered.py

      - name: Finalize canonical dynasty and rival data
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: python finalize_franchise_summaries.py

      - name: Verify all franchise summaries
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("knowledge/franchise_summaries")
          files = sorted(path for path in root.glob("*.json") if path.name != "manifest.json")
          if len(files) != 16:
              raise SystemExit(f"Expected 16 franchise summaries, found {len(files)}")

          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("franchise_count") != 16 or len(manifest.get("files", [])) != 16:
              raise SystemExit("Manifest does not declare all 16 franchise summaries")

          generated = datetime.fromisoformat(manifest["generated_at"])
          if generated.tzinfo is None:
              generated = generated.replace(tzinfo=timezone.utc)
          age_seconds = (datetime.now(timezone.utc) - generated.astimezone(timezone.utc)).total_seconds()
          if age_seconds > 900:
              raise SystemExit(f"Generated manifest is stale by {age_seconds:.0f} seconds")

          summaries = []
          for path in files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              summaries.append((path, payload))

              dynasty = payload.get("dynasty_power") or {}
              rank = int(dynasty.get("rank") or 0)
              league_size = int(dynasty.get("league_size") or 0)
              if league_size != 16 or rank < 1 or rank > 16:
                  raise SystemExit(f"Invalid dynasty rank metadata in {path}: {dynasty}")

              expected_score = round(
                  float(dynasty.get("player_d_avi") or 0)
                  + float(dynasty.get("future_pick_d_avi") or 0),
                  2,
              )
              actual_score = round(float(dynasty.get("score") or 0), 2)
              if expected_score != actual_score:
                  raise SystemExit(
                      f"Dynasty score does not reconcile in {path}: "
                      f"expected {expected_score}, found {actual_score}"
                  )

              sections = {
                  section.get("id"): section
                  for section in payload.get("sections", [])
                  if isinstance(section, dict) and section.get("id")
              }
              trade_section = sections.get("latest-trade-impact")
              if not trade_section:
                  raise SystemExit(f"Missing Latest Trade Impact section: {path}")

              latest_trade = payload.get("latest_trade")
              trade_body = str(trade_section.get("body") or "").strip()
              if latest_trade:
                  summary = str(latest_trade.get("summary") or "").strip()
                  if not summary:
                      raise SystemExit(f"Latest trade has no summary: {path}")
                  if trade_body != summary:
                      raise SystemExit(f"Latest Trade Impact does not match latest_trade: {path}")
                  if "no verified franchise trade" in trade_body.casefold() or "no franchise trade" in trade_body.casefold():
                      raise SystemExit(f"False no-trade fallback remains: {path}")

              projected = payload.get("projected_power") or {}
              team_below = projected.get("team_below")
              rival = payload.get("rival_below")
              if team_below is None:
                  if rival is not None:
                      raise SystemExit(f"Unexpected Rival Watch for last-place franchise: {path}")
              else:
                  if not rival:
                      raise SystemExit(f"Missing Rival Watch: {path}")
                  if rival.get("franchise_name") != team_below.get("name"):
                      raise SystemExit(f"Rival Watch does not match team_below: {path}")
                  if rival.get("projected_rank") != team_below.get("rank"):
                      raise SystemExit(f"Rival Watch rank does not match team_below: {path}")

              if "original roster" in path.read_text(encoding="utf-8").casefold():
                  raise SystemExit(f"Untranslated roster ID found in {path}")

          ranks = [int(payload["dynasty_power"]["rank"]) for _, payload in summaries]
          if sorted(ranks) != list(range(1, 17)):
              raise SystemExit(f"Dynasty ranks are not a unique 1-16 ladder: {ranks}")

          expected_order = sorted(
              summaries,
              key=lambda item: (
                  float(item[1]["dynasty_power"]["score"]),
                  float((item[1].get("projected_power") or {}).get("score") or 0),
                  str(item[1].get("franchise_name") or ""),
              ),
              reverse=True,
          )
          for expected_rank, (path, payload) in enumerate(expected_order, start=1):
              actual_rank = int(payload["dynasty_power"]["rank"])
              if actual_rank != expected_rank:
                  raise SystemExit(
                      f"Dynasty ladder ordering mismatch in {path}: "
                      f"expected rank {expected_rank}, found {actual_rank}"
                  )

          print("Verified all 16 franchise summaries with dynamic league-wide validation.")
          PY

      - name: Commit refreshed source and summaries
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.local_time.outputs.allowed == 'true'
        shell: bash
        run: |
          git config user.name "AVI-Automation"
          git config user.email "actions@users.noreply.github.com"
          git add generate_weekly_executive_summary_filtered.py knowledge/franchise_summaries
          if git diff --cached --quiet; then
            echo "No franchise summary changes to commit."
            exit 0
          fi
          git commit -m "Refresh weekly franchise executive summaries"
          git pull --rebase origin main
          git push origin HEAD:main
