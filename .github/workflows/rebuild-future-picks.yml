name: Rebuild Accurate Future Draft Picks
on:
  push:
    paths:
      - '.github/workflows/rebuild-future-picks.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AVI Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Remove retired 2026 picks from raw Sleeper snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path('data/raw/sleeper/leagues').glob('*/traded_picks.json'):
              data = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, list):
                  continue
              cleaned = []
              for item in data:
                  if not isinstance(item, dict):
                      continue
                  try:
                      season = int(item.get('season', 0))
                  except (TypeError, ValueError):
                      continue
                  if season >= 2027:
                      cleaned.append(item)
              path.write_text(json.dumps(cleaned, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Rebuild future draft values and ownership
        run: python -m avi.cli build-draft-pick-values
      - name: Validate ownership model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('data/processed/reports/draft_pick_values.json').read_text())
          picks = payload.get('picks', [])
          assert payload.get('active_draft_season_start') == 2027
          assert payload.get('max_rounds') == 20
          assert len(picks) == 640, len(picks)
          assert all(int(p['season']) >= 2027 for p in picks)
          assert all(p.get('original_roster_id') in range(1, 17) for p in picks)
          assert all(p.get('current_owner_roster_id') in range(1, 17) for p in picks)
          checks = {
              (2027, 1, 9): 15,
              (2027, 2, 15): 9,
              (2027, 1, 11): 2,
              (2027, 3, 11): 16,
              (2027, 1, 1): 5,
              (2028, 1, 9): 12,
              (2028, 2, 11): 16,
          }
          index = {(int(p['season']), int(p['round']), int(p['original_roster_id'])): int(p['current_owner_roster_id']) for p in picks}
          for key, expected in checks.items():
              assert index.get(key) == expected, (key, index.get(key), expected)
          print('Validated 640 active future picks and known traded ownership')
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Commit regenerated source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data knowledge
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Rebuild accurate 2027+ draft ownership'
            git push
          fi
