name: Retire 2026 Picks From AVI Core
on:
  push:
    paths:
      - '.github/workflows/retire-2026-picks-source.yml'
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retire 2026 pick data and patch generators
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          ACTIVE_PICK_SEASON = 2027
          root = Path('.')

          # Replace the draft-pick report generator with a future-only source.
          Path('src/avi/reports/draft_pick_values.py').write_text('''from __future__ import annotations

from datetime import UTC, datetime
from pathlib import Path
from typing import Any

from avi.io import read_json, write_json
from avi.league.loader import find_current_league_file
from avi.valuation.picks import MAX_DRAFT_ROUNDS, TEAMS_PER_ROUND, draft_pick_value

MARKDOWN_OUTPUT_PATH = Path("knowledge/01_AVI_Draft_Pick_Values_0_100.md")
JSON_OUTPUT_PATH = Path("data/processed/reports/draft_pick_values.json")
ACTIVE_DRAFT_SEASONS = (2027, 2028)


def pick_category(value: float) -> str:
    if value >= 90.0:
        return "Elite Franchise Asset"
    if value >= 80.0:
        return "Blue-Chip Starter"
    if value >= 70.0:
        return "Premium Starter"
    if value >= 50.0:
        return "Useful Starter / High-Value Depth"
    if value >= 35.0:
        return "Rosterable Depth / Upside Stash"
    if value >= 20.0:
        return "Speculative Stash"
    if value > 0.0:
        return "Replacement / Watch List"
    return "No Current AVI"


def build_active_picks() -> list[dict[str, Any]]:
    picks: list[dict[str, Any]] = []
    for season in ACTIVE_DRAFT_SEASONS:
        for round_number in range(1, MAX_DRAFT_ROUNDS + 1):
            for slot in range(1, TEAMS_PER_ROUND + 1):
                value = draft_pick_value(round_number=round_number, slot=slot)
                picks.append({
                    "pick_id": f"{season}_{round_number:02d}_{slot:02d}",
                    "pick_label": f"{season} {round_number}.{slot:02d}",
                    "season": season,
                    "round": round_number,
                    "slot": slot,
                    "original_team": "TBD",
                    "original_roster_id": None,
                    "current_owner_team": "TBD",
                    "current_owner_roster_id": None,
                    "draft_pick_avi": value,
                    "avi_category": pick_category(value),
                    "validation_status": "future_order_tbd",
                })
    return picks


def build_draft_pick_values() -> dict[str, Any]:
    league_path = find_current_league_file()
    league = read_json(league_path)
    if not isinstance(league, dict):
        raise RuntimeError("Current Sleeper league.json must contain a JSON object.")

    picks = build_active_picks()
    payload = {
        "generated_at_utc": datetime.now(UTC).isoformat(),
        "league_id": league.get("league_id"),
        "active_draft_seasons": list(ACTIVE_DRAFT_SEASONS),
        "max_rounds": MAX_DRAFT_ROUNDS,
        "teams_per_round": TEAMS_PER_ROUND,
        "pick_count": len(picks),
        "curve": {
            "starting_value": 95.0,
            "depreciation_per_pick": 1.2,
            "minimum_value": 0.0,
        },
        "picks": picks,
    }
    write_json(JSON_OUTPUT_PATH, payload)

    lines = [
        "# AVI DRAFT PICK VALUES",
        "",
        "Retrieval purpose: official AVI values for active future draft capital.",
        "",
        "- Active draft capital begins with the 2027 class.",
        "- Original teams and current owners remain TBD until each season's draft order is established.",
        "- Pick AVI resets to 95.0 at 1.01 for each active draft year.",
        "- Every subsequent pick depreciates by 1.2.",
        "- Draft-pick AVI is floored at 0.0.",
        "- Rounds above the configured 10-round league depth are excluded.",
        "",
    ]
    for pick in picks:
        lines.extend([
            f"## PICK: {pick['pick_label']} | {pick['pick_id']}",
            f"- Pick label: {pick['pick_label']}",
            f"- Season: {pick['season']}",
            f"- Round: {pick['round']}",
            f"- Slot: {pick['slot']}",
            "- Original team: TBD",
            "- Current owner: TBD",
            f"- Draft Pick AVI: {pick['draft_pick_avi']}",
            f"- AVI category: {pick['avi_category']}",
            "- Validation status: future_order_tbd",
            "",
        ])
    MARKDOWN_OUTPUT_PATH.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
    print(f"Wrote {JSON_OUTPUT_PATH} and {MARKDOWN_OUTPUT_PATH} with {len(picks)} active picks")
    return payload
''', encoding='utf-8')

          # Prevent historical-trade regeneration from restoring retired picks.
          historical_path = Path('src/avi/reports/historical_trades.py')
          historical = historical_path.read_text(encoding='utf-8')
          marker = '    for pick in draft_picks:\n'
          replacement = (
              '    for pick in draft_picks:\n'
              '        try:\n'
              '            pick_season = int(pick.get("season", 0)) if isinstance(pick, dict) else 0\n'
              '        except (TypeError, ValueError):\n'
              '            pick_season = 0\n'
              '        if pick_season < 2027:\n'
              '            continue\n'
          )
          if replacement not in historical:
              if marker not in historical:
                  raise RuntimeError('Could not locate historical draft-pick loop')
              historical = historical.replace(marker, replacement, 1)
          historical_path.write_text(historical, encoding='utf-8')

          pick_id_re = re.compile(r'^2026_(?:0?[1-9]|10)_(?:0?[1-9]|1[0-6])$', re.I)
          pick_label_re = re.compile(r'^2026\s+(?:pick\s+)?(?:[1-9]|10)\.(?:0?[1-9]|1[0-6])$', re.I)
          round_phrase_re = re.compile(r'2026\s+Round\s+\d+\s*\([^)]*\)', re.I)
          exact_phrase_re = re.compile(r'2026\s+(?:Pick\s+)?(?:[1-9]|10)\.(?:0?[1-9]|1[0-6])', re.I)

          def is_retired_pick_object(obj):
              if not isinstance(obj, dict):
                  return False
              pick_id = obj.get('pick_id')
              if isinstance(pick_id, str) and pick_id_re.match(pick_id):
                  return True
              season = obj.get('season', obj.get('year', obj.get('draft_year')))
              try:
                  season_int = int(season)
              except (TypeError, ValueError):
                  season_int = None
              keys = {str(key).lower() for key in obj}
              pick_shape = bool(keys & {
                  'round', 'slot', 'pick_label', 'pick_id', 'roster_id',
                  'original_roster_id', 'current_owner_roster_id',
                  'previous_owner_id', 'owner_id', 'draft_pick_avi'
              })
              if season_int == 2026 and pick_shape and ('round' in keys or 'pick_id' in keys or 'pick_label' in keys):
                  return True
              label = obj.get('pick_label', obj.get('label'))
              return isinstance(label, str) and (pick_label_re.match(label) is not None)

          def clean_text(value):
              if not isinstance(value, str):
                  return value
              text = round_phrase_re.sub('', value)
              text = exact_phrase_re.sub('', text)
              text = re.sub(r'2026_(?:0?[1-9]|10)_(?:0?[1-9]|1[0-6])', '', text)
              text = re.sub(r'\s+,', ',', text)
              text = re.sub(r',\s*,+', ', ', text)
              text = re.sub(r'\b(?:and|with)\s*,', '', text, flags=re.I)
              text = re.sub(r',\s*(?:and|with)\s+(?=(?:sent|acquired|received|traded)\b)', ' and ', text, flags=re.I)
              text = re.sub(r'\s{2,}', ' ', text).strip()
              text = re.sub(r'\s+([.,])', r'\1', text)
              text = re.sub(r',\s*(and|sent|received|acquired)\b', r' \1', text, flags=re.I)
              return text

          def clean_json(value):
              if isinstance(value, list):
                  cleaned = []
                  for item in value:
                      if is_retired_pick_object(item):
                          continue
                      next_item = clean_json(item)
                      if isinstance(next_item, str) and not next_item:
                          continue
                      cleaned.append(next_item)
                  return cleaned
              if isinstance(value, dict):
                  return {key: clean_json(item) for key, item in value.items()}
              if isinstance(value, str):
                  return clean_text(value)
              return value

          changed_json = []
          for path in sorted(root.rglob('*.json')):
              if any(part in {'.git', '.venv', 'venv', '__pycache__'} for part in path.parts):
                  continue
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  continue
              cleaned = clean_json(payload)
              serialized = json.dumps(cleaned, indent=2, ensure_ascii=False) + '\n'
              before = path.read_text(encoding='utf-8')
              if serialized != before:
                  path.write_text(serialized, encoding='utf-8')
                  changed_json.append(str(path))

          # Clean generated Markdown trade descriptions while preserving 2026 dates/seasons.
          for path in [Path('knowledge/02_AVI_Historical_Trades.md')]:
              if not path.exists():
                  continue
              lines = []
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.startswith('- Picks received:') or line.startswith('- Picks sent:'):
                      prefix, _, raw = line.partition(':')
                      assets = [item.strip() for item in raw.split(',') if item.strip()]
                      assets = [item for item in assets if not item.lower().startswith('2026 round ')]
                      line = f'{prefix}: ' + (', '.join(assets) if assets else 'None')
                  else:
                      line = clean_text(line)
                  lines.append(line)
              path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          print(f'Cleaned {len(changed_json)} JSON files')
          PY
      - name: Regenerate canonical reports
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from avi.reports.draft_pick_values import build_draft_pick_values
          from avi.reports.historical_trades import build_historical_trades
          build_draft_pick_values()
          build_historical_trades()
          PY
      - name: Clean derived summaries after regeneration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          pattern = re.compile(r'2026\s+Round\s+\d+\s*\([^)]*\)', re.I)
          def clean(s):
              if not isinstance(s, str): return s
              s = pattern.sub('', s)
              s = re.sub(r'\s+,', ',', s)
              s = re.sub(r',\s*,+', ', ', s)
              s = re.sub(r'\s{2,}', ' ', s).strip()
              s = re.sub(r'\s+([.,])', r'\1', s)
              return s
          def walk(v):
              if isinstance(v, dict): return {k: walk(x) for k, x in v.items()}
              if isinstance(v, list): return [walk(x) for x in v]
              return clean(v)
          for path in Path('knowledge/franchise_summaries').glob('*.json'):
              data = json.loads(path.read_text(encoding='utf-8'))
              path.write_text(json.dumps(walk(data), indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate no active 2026 pick references remain
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = [
              re.compile(r'2026_(?:0?[1-9]|10)_(?:0?[1-9]|1[0-6])', re.I),
              re.compile(r'2026\s+Round\s+\d+', re.I),
              re.compile(r'2026\s+(?:Pick\s+)?(?:[1-9]|10)\.(?:0?[1-9]|1[0-6])', re.I),
          ]
          offenders = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.json','.md','.txt','.py','.yml','.yaml','.csv'}:
                  continue
              if any(part in {'.git','.venv','venv','__pycache__'} for part in path.parts):
                  continue
              if path.name in {'audit_retired_2026_picks.txt'} or path.name == 'retire-2026-picks-source.yml':
                  continue
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for number, line in enumerate(text.splitlines(), 1):
                  if any(p.search(line) for p in patterns):
                      offenders.append(f'{path}:{number}: {line[:300]}')
          if offenders:
              print('\n'.join(offenders[:200]))
              sys.exit(f'{len(offenders)} retired 2026 pick references remain')
          print('No retired 2026 pick references remain')
          PY
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Commit source and data cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired 2026 draft picks from AVI Core'
          git push
